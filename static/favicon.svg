			<stop offset="0" stop-color="#4f8fd6" />
			<stop offset="1" stop-color="#2f62a8" />
		</linearGradient>
		<linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#e2574c" />
