# Install native binaries (rolldown, lightningcss, Tailwind oxide) for Windows and WSL,
# so the same node_modules works on both sides.
supportedArchitectures:
  os:
    - current
    - win32
    - linux
  cpu:
    - x64
  libc:
    - glibc

# Windows and WSL use different store paths; without this setting each side considers the other's
# install outdated and reinstalls everything on every `pnpm run`.
verifyDepsBeforeRun: false

# Security minimum versions for transitive dependencies. pnpm 10 reads overrides only here
# (or in package.json), no longer from .npmrc. Direct dependencies are bumped in package.json.
overrides:
  cookie@<0.7.0: ^0.7.2
  devalue@<5.9.3: ^5.9.3
  nanoid@<3.3.18: ^3.3.18
  postcss@<8.5.23: ^8.5.23
  source-map-js@<1.2.2: ^1.2.2

# Temporarily ignored advisories, none exploitable in our setup:
auditConfig:
  ignoreGhsas:
    # ReDoS in picomatch: build tool only, processes no untrusted patterns. No fixed version
    # yet; once there is one, remove this and add a minimum version under overrides.
    - GHSA-fc5q-39xc-vjpf
    # SvelteKit, redirect via enhanced form submission: no form actions/use:enhance,
    # adapter-static without a server. Fixed only in 3.1.1; remove with the upgrade to SvelteKit 3.
    # pnpm reports the first ID, the advisory page the second.
    - GHSA-3r8g-jcqq-3p5j
    - GHSA-pfhg-q3qv-9q6r
