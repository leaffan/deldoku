# Native Binaries (rolldown, lightningcss, Tailwind oxide) für Windows und WSL installieren,
# damit dasselbe node_modules auf beiden Seiten funktioniert.
supportedArchitectures:
  os:
    - current
    - win32
    - linux
  cpu:
    - x64
  libc:
    - glibc

# Windows und WSL nutzen unterschiedliche Store-Pfade; ohne diese Einstellung hält jede Seite die
# Installation der anderen für veraltet und installiert bei jedem `pnpm run` komplett neu.
verifyDepsBeforeRun: false

# Sicherheits-Untergrenzen für transitive Abhängigkeiten. pnpm 10 liest Overrides nur noch hier
# (oder in package.json), nicht mehr aus .npmrc. Direkte Abhängigkeiten werden in package.json angehoben.
overrides:
  cookie@<0.7.0: ^0.7.2
  devalue@<5.9.3: ^5.9.3
  nanoid@<3.3.18: ^3.3.18
  postcss@<8.5.23: ^8.5.23
  source-map-js@<1.2.2: ^1.2.2

# Vorübergehend ignorierte Meldungen, jeweils bei uns nicht ausnutzbar:
auditConfig:
  ignoreGhsas:
    # ReDoS in picomatch: nur Build-Werkzeug, verarbeitet keine fremden Muster. Noch keine
    # korrigierte Version; sobald es eine gibt, entfernen und unter overrides eine Untergrenze ergänzen.
    - GHSA-fc5q-39xc-vjpf
    # SvelteKit, Weiterleitung über enhanced form submission: keine Form Actions/use:enhance,
    # adapter-static ohne Server. Behoben erst in 3.1.1; entfernen mit dem Upgrade auf SvelteKit 3.
    # pnpm meldet die erste ID, die Advisory-Seite die zweite.
    - GHSA-3r8g-jcqq-3p5j
    - GHSA-pfhg-q3qv-9q6r
