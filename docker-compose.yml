# Local PHP backend for `pnpm run dev` (same directory layout as on the server)
services:
  php:
    image: php:8.2-cli
    command: php -S 0.0.0.0:8000 -t /srv
    environment:
      PHP_CLI_SERVER_WORKERS: '4'
    ports:
      - '8090:8000'
    volumes:
      - ./static:/srv/deldoku
      - ./.dev-data:/srv/data
