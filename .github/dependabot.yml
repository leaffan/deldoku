# Weekly updates, grouped; security updates arrive immediately regardless
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Minor and patch updates in one PR; major updates separately, since they are more likely to break things
      npm-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']

  # pytest for the API tests (tests/api/Dockerfile installs requirements.txt)
  - package-ecosystem: pip
    directory: /tests/api
    schedule:
      interval: weekly
      day: monday
