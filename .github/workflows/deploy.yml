name: Deploy

# Test instance: automatically once CI is green on main, or manually with any branch
# (to try things out before merging; the next merge to main overwrites it again).
# Live: manually with a release tag; the "production" environment requires approval.
# Host, credentials and target live only in the environment secrets; on the server the deploy key
# is restricted to the instance directory. The repo is public, and so are the logs:
# print nothing that reveals paths or file lists.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'test: the branch selected above; production: the release tag below'
        type: choice
        options: [test, production]
        default: test
      tag:
        description: Release tag for production (e.g. 2.0.0)
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'test' }}
    # Only after a successful CI run for a push to main (not after the weekly audit run)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'test' }}
      url: ${{ vars.DEPLOY_URL }}
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'test' }}
      cancel-in-progress: false
    env:
      PRODUCTION: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check release tag
        if: env.PRODUCTION == 'true'
        run: |
          [[ $TAG =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a release tag like 2.0.0"; exit 1; }

      - uses: actions/checkout@v7
        with:
          # production: the tag; test (manual): the selected branch; test (automatic): the CI commit
          ref: ${{ env.PRODUCTION == 'true' && format('refs/tags/{0}', inputs.tag) || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Check that the tag is on main and matches package.json
        if: env.PRODUCTION == 'true'
        run: |
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          version=$(node -p "require('./package.json').version")
          [ "$version" = "$TAG" ] || { echo "::error::package.json has $version, not $TAG"; exit 1; }

      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          # Commit as build ID in _app/version.json, so the smoke test recognizes exactly this build
          BUILD_SHA=$(git rev-parse HEAD) pnpm build
          # Keep the test instance out of search engines
          if [ "$PRODUCTION" != true ]; then
            printf 'User-agent: *\nDisallow: /\n' > build/robots.txt
          fi
        env:
          # Base path /deldoku_tst instead of /deldoku (vite.config.ts)
          VITE_BUILD_ENV: ${{ env.PRODUCTION == 'true' && 'production' || 'test' }}

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          # On the server, rrsync restricts the key to the instance directory; "./" is its root.
          # challenges/: ship only fallback.json and .htaccess (prevents directory listing), never touch the
          # daily challenges on the server (excluded files are also protected from --delete).
          # The test instance shares challenges/ with production and skips the directory entirely, so
          # a branch never overwrites production's files.
          if [ "$PRODUCTION" = true ]; then
            challenges=(--filter='+ /challenges/' --filter='+ /challenges/fallback.json'
              --filter='+ /challenges/.htaccess' --filter='- /challenges/*')
          else
            # No trailing "/": also matches the symlink on the server, otherwise --delete-after removes it
            challenges=(--filter='- /challenges')
          fi
          sync() {
            rsync -rlz --checksum --chmod=D755,F644 -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes" \
              "${challenges[@]}" "$@" build/ "$TARGET:./"
          }
          # 1. Put new files next to the old ones; index.html still references the old scripts
          sync --exclude=/index.html
          # 2. Switch index.html, only then delete stale files
          sync --delete-after

      - name: Smoke test
        env:
          URL: ${{ vars.DEPLOY_URL }}
        run: |
          version=$(node -p "require('./package.json').version")
          page=$(curl -fsS --retry 3 --retry-all-errors "$URL/")
          # The footer links the release of the deployed version
          grep -q "releases/tag/$version\"" <<<"$page" \
            || { echo "::error::page does not show version $version"; exit 1; }
          # The version stays the same between releases; only the commit proves this build is live
          sha=$(git rev-parse HEAD)
          curl -fsS --retry 3 --retry-all-errors -H 'Cache-Control: no-cache' "$URL/_app/version.json" \
            | jq -e --arg sha "$sha" '.version == $sha' >/dev/null \
            || { echo "::error::server does not run build $sha"; exit 1; }
          curl -fsS --retry 3 --retry-all-errors "$URL/api/stats.php?date=$(date -u +%F)" \
            | jq -e 'type == "object"' >/dev/null \
            || { echo "::error::stats API did not return JSON"; exit 1; }
          echo "Deployed $version, page and API respond"
