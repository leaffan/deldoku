# Groups the auto-generated release notes (from PR titles) by label
changelog:
  exclude:
    labels: [duplicate, invalid, wontfix]
  categories:
    - title: Fixes
      labels: [defect, bug]
    - title: Features
      labels: [enhancement]
    - title: Infrastructure
      labels: [infra]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other
      labels: ['*']
